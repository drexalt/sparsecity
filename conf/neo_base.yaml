defaults:
  - _self_
  - model: neo

seed: 1776

data:
  name: "jturner116/msmarco-hard-negatives-scored-stella"
  split: "train"

use_distillation: False
custom_kernel: True
use_grad_cache: False
bf16: True
accum_steps: 8
batch_size: 8
mini_batch: 64
num_negatives: 32
sample_size: 4
n_ways: 5
proximity_threshold: 0.05
mse_weight: 0.02
kl_weight: 1.0
max_length: 256
lambda_d: 5.0e-4
lambda_q: 1.0e-4
T_d: 50000
T_q: 50000
# Top-k scheduling
top_k: null
schedule_top_k: False
initial_top_k: 50000
top_k_warmup_steps: 40000
epochs: 20
sparse_embed: False
init_ce_temp: null
init_kl_temp: null
optimizer:
  learning_rate: 5e-5
  warmup_steps: 15000
  grad_clip_warmup_steps: 6000
  decay_steps: 50000
  stable_steps: 50000
  weight_decay: 0.10
  max_grad_norm: null
  rep_grad_clip: null
checkpoint:
  max_to_keep: 3
  save_interval_steps: 800
  checkpoint_path: "checkpoints/neo"
evaluation:
  eval_every_steps: 1500
  datasets: ["scifact", "msmarco", "touche2020", "scidocs", "nfcorpus"]
  batch_size: 16
wandb: True
wandb_project: "splade-neo"
log_every: 20


